AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Payments Email Bot — Stage 1 worker (AWS_DEPLOYMENT_PLAN.md §2). One scheduled Lambda
  replicating what the workstation task does today: fetch unread carrier mail, run the
  pipeline and the pre-send gate, save gate-passing replies to Gmail Drafts. Sends nothing.

# ---------------------------------------------------------------------------
# Plain CloudFormation rather than SAM (§3.1 P3 recommended SAM). The deployment
# host is Windows and SAM's reliable path to Linux wheels for pydantic-core is
# Docker; deploy.ps1 cross-targets manylinux with pip instead, so the only
# prerequisite is the AWS CLI. The resource set here is small enough that SAM's
# transform would be saving very little.
# ---------------------------------------------------------------------------

Parameters:
  StackEnv:
    Type: String
    Default: prod
    AllowedValues: [staging, prod]
    Description: Names resources and sets PAYBOT_ENV.

  CodeS3Bucket:
    Type: String
    Description: Bucket holding the deployment zip (deploy.ps1 creates and uploads).
  CodeS3Key:
    Type: String
    Description: Key of the deployment zip. Versioned per deploy so updates are detected.

  RosterBucket:
    Type: String
    Default: ""
    Description: >
      Bucket holding factoring_domains.json and carrier_contacts.json. Business data with
      its own lifecycle (§3.3), fetched at cold start — never baked into the artifact.
      Blank disables both fetches.
  RosterKey:
    Type: String
    Default: factoring_domains.json
  CarrierContactsKey:
    Type: String
    Default: ""
    Description: >
      Key of carrier_contacts.json in RosterBucket — exact addresses authorised for one
      carrier's loads, on top of the back office record. Same bucket as the roster because
      one config bucket holds both; the IAM grant below is per-key regardless. Blank
      disables the fetch, leaving the inline PAYBOT_CARRIER_CONTACTS entries to stand alone.

  CargoTelCookieBucket:
    Type: String
    Default: circle-bot-cookies
    Description: >
      The login bot's bucket. Not ours — the grant below is scoped to the single cookie
      key, read-only, and is the only cross-system permission in this stack (§3.4).
  CargoTelCookieKey:
    Type: String
    Default: rubicon/cargotel.json

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    Description: >
      Inference profile, not a bare model id — the profile carries the cross-region
      capacity. Confirm the exact string against the account before deploying; the version
      suffix is not universal (sonnet-5 has none, sonnet-4-5 is …-20250929-v1:0) and a
      wrong id deploys cleanly and fails at the first converse call. Model access must be
      enabled by hand first — see deploy/README.md step 1.

  GmailUser:
    Type: String
    Default: ""
    Description: >
      The mailbox the service account impersonates. A Google Group cannot be impersonated,
      so this must be a real user; the query below is what narrows it to group mail.
  GmailQuery:
    Type: String
    Default: "is:unread"
  FetchLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 200
    Description: >
      5, not the local default of 10. The turn budget scales with load count (§3.7), so ten
      multi-load emails can exceed Lambda's 15-minute cap outright. The 20-minute cadence
      absorbs a lower limit easily. Raise only after measuring real per-email wall time.

  TransportProBaseUrl:
    Type: String
    Default: ""
  TransportProUsername:
    Type: String
    Default: ""

  GateBlockRetryLimit:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 50
    Description: >
      How many times a gate-BLOCKED message may re-run the full agent loop before later
      runs skip it and leave it to a human. Blocks are the expensive retry — the whole
      model loop re-bills every run until someone acts (measured: one stuck thread,
      ~48 retries and several dollars a night). Counted per message id in
      state/gate_block_ledger.json inside RosterBucket; 0 disables the cap. Escalations
      are unaffected: they stop before any model call and re-checking them is near-free.

  ReplySignature:
    Type: String
    Default: Circle Delivers Payments
  ReplyCc:
    Type: String
    Default: "[]"
    Description: >
      JSON list of addresses, e.g. ["a@x.com"] — never a bare address. reply_cc is a
      tuple setting, so pydantic-settings json-parses the env var; anything that is not
      valid JSON (including empty string) kills the worker at startup with SettingsError.
  ReplyTo:
    Type: String
    Default: ""
    Description: >
      Reply-To header on every draft and chat-approved send. Set it to the group address
      so a carrier's plain Reply returns to the monitored mailbox rather than to the
      individual whose name the reply went out under. Blank omits the header (today's
      behaviour).

  # ---- Chat approval (docs/CHAT_APPROVAL_PLAN.md). All default OFF: a deploy with ----
  # ---- these untouched is behaviourally identical to the stack before they existed. --
  ApprovalMode:
    Type: String
    Default: drafts
    AllowedValues: [drafts, chat]
    Description: >
      Where a gate-passing reply waits for its human. `drafts` (default) saves it to the
      reading mailbox's Gmail Drafts — today's behaviour. `chat` posts it as a Google
      Chat card whose Approve button sends AS THE CLICKER via the callback function.
      The rollback for the whole chat flow is flipping this back to drafts.
  Reviewers:
    Type: String
    Default: "[]"
    Description: >
      JSON list of the Workspace addresses allowed to act on approval cards — same
      JSON-list footgun as ReplyCc. Empty means no click can send anything.
  ChatSpace:
    Type: String
    Default: ""
    Description: >
      Google Chat space (spaces/XXXX) for the cards. Blank posts nothing anywhere and
      skips creating the callback function entirely. Set with ApprovalMode=drafts, this
      is shadow mode: every draft, escalation and gate block appears as a card (with the
      short reason for the latter two), buttons absent, Gmail Drafts unchanged.
  ChatAudience:
    Type: String
    Default: ""
    Description: >
      GCP project NUMBER of the Chat app — the audience the callback verifies Google's
      bearer token against. Blank makes the callback reject every request (fail closed),
      so a half-configured deploy is inert rather than open.
  ApprovalExpiryDays:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 30
    Description: >
      Days an approval card may sit unclicked before the sweep marks it expired and the
      card says a human must reply from the group mailbox. Chat-flow sibling of the
      gate-block retry cap: expired mail sits unread and nothing retries it.
  DocumentsEmail:
    Type: String
    Default: freightpay@circledelivers.com
  PortalUrl:
    Type: String
    Default: ""

  AllowFactoring:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  CargoTelReplies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      §3.1 P9 recommends enabling in Stage 1: it is off by default, and parallel running is
      the cheapest way to learn the 6-digit path's real failure rate before humans rely on it.
  SensitiveBankReplies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  SensitiveNoaReplies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  NoaAttachmentReplies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Draft past an ATTACHED NOA, distinct from the NOA wording SensitiveNoaReplies governs.
      Pre-funding factors attach their NOA to routine rate verifications as part of the
      standard packet, so with this off every one of them escalates unanswered. The NOA still
      needs a human to verify and file — the draft cannot do either, and the gate's
      change_acknowledgment check forbids the reply from claiming it was filed. Void-check /
      direct-deposit attachments and contact changes escalate in every configuration.
  AutoAddFactoringDomains:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Add an unknown factoring sender's domain to the roster automatically and answer, instead
      of escalating. THE MOST CONSEQUENTIAL SWITCH IN THIS STACK: enabled, the roster stops
      being a list of domains somebody verified and becomes a list of domains that wrote in
      and named a factor already on the load. payment_bot.roster_candidate argues this decision
      is not automatable and is worth reading first. Defaults OFF. An entry is only ever
      written for a load whose factor record already names that company; free mail, domains
      rostered to another company, loads with no factor on file, and sensitive-change mail are
      refused regardless. Every auto-add is logged WARNING as auto_roster_entry_added and
      marked AUTO-ADDED in factoring_domains_manual.json so it can be revoked.
  LlmIdFilter:
    Type: String
    Default: shadow
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Whether the model gets to drop extracted load-id candidates. It can only ever REMOVE
      candidates the regex already produced, so it cannot introduce a load id, and every
      failure returns them unchanged. `shadow` calls it and logs what it would drop, changing
      nothing — the way to measure agreement on real mail before anything depends on it.
      Defaults to shadow rather than enforce so a new stack measures before it acts; flip to
      enforce once the id_filter_shadow lines look right. Reading PDF attachments made the
      regex's precision problem materially worse, which is what this exists to absorb.
  FactoringPrenoaReplies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Authorise a roster-verified factor asking about a load that shows NO factor on file —
      the standard pre-funding flow, where the factor verifies the rate before its NOA
      reaches us. Off, those senders are DENIED outright ("neither a contact on the carrier's
      record nor a configured domain for the factor on file"), which is a large share of
      inbound factoring mail. Needs AllowFactoring=true to have any effect.

  ScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Deploy DISABLED (§4 step 1). Invoke manually once, diff the log against the same
      hour's workstation log, and only then flip this to true.
  ScheduleExpression:
    Type: String
    Default: cron(15,35,55 * * * ? *)
    Description: >
      :15 past, and every 20 minutes. Offset from the workstation task's :39 so the two can
      run interleaved during parallel running — thread-skip makes double-processing safe.

  Timezone:
    Type: String
    Default: America/New_York
    Description: >
      A correctness input, not a logging detail. ToolContext.today resolves the calendar
      date the gate's tense check judges against; under the UTC default a run after 20:00
      Eastern is already on tomorrow and would score a same-day pay date as a day late.
      Use the zone name — TZ=EST pins UTC-5 all year and is an hour wrong in summer.

  LogRetentionDays:
    Type: Number
    Default: 90

  AlarmEmail:
    Type: String
    Default: ""
    Description: Subscribed to the alarm topic. Blank creates the topic with no subscriber.

Conditions:
  # The callback exists only when a space is configured — a default deploy carries no
  # public URL at all, which is what "not live" means at the infrastructure level.
  HasChatSpace: !Not [!Equals [!Ref ChatSpace, ""]]
  HasRoster: !Not [!Equals [!Ref RosterBucket, ""]]
  # Both must be set: the bucket alone cannot be fetched from, and a key with no bucket has
  # nowhere to come from. Keeps the grant absent rather than malformed when only one is given.
  HasCarrierContacts: !And
    - !Not [!Equals [!Ref RosterBucket, ""]]
    - !Not [!Equals [!Ref CarrierContactsKey, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  CargoTelOn: !Equals [!Ref CargoTelReplies, "true"]
  ScheduleOn: !Equals [!Ref ScheduleEnabled, "true"]

Resources:
  # -------------------------------------------------------------------------
  # Secrets. Created empty on purpose: the stack owns their existence and IAM,
  # never their values. deploy.ps1 prints the put-secret-value commands.
  # -------------------------------------------------------------------------
  GoogleServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "paybot/${StackEnv}/google-sa-json"
      Description: >
        Google service-account key JSON, whole. Reaches the bot as PAYBOT_GOOGLE_SA_JSON;
        scopes stay gmail.readonly + gmail.compose (§3.4) — no new Google-side grants.
      SecretString: "PLACEHOLDER - run the put-secret-value command from deploy/README.md"

  TransportProPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "paybot/${StackEnv}/tp-password"
      Description: Transport Pro API password. Reaches the bot as PAYBOT_TP_PASSWORD.
      SecretString: "PLACEHOLDER - run the put-secret-value command from deploy/README.md"

  # -------------------------------------------------------------------------
  # Execution role — one statement per thing the worker actually does (§3.4).
  # -------------------------------------------------------------------------
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "paybot-worker-${StackEnv}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: paybot-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Bedrock. Both ARN shapes: an inference profile is the thing invoked, and
              # it fans out to foundation models in the underlying regions, which are
              # what the authorization is actually checked against.
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref GoogleServiceAccountSecret
                  - !Ref TransportProPasswordSecret
              - !If
                - HasRoster
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:aws:s3:::${RosterBucket}/${RosterKey}"
                - !Ref AWS::NoValue
              # The gate-block retry ledger and the pending chat approvals — the worker's
              # own bookkeeping, so this is the one prefix it may WRITE. Scoped to state/*
              # so it can never touch the operator-owned rosters above. Delete exists for
              # the approval sweep's pruning of terminal entries, nothing else.
              - !If
                - HasRoster
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                  Resource: !Sub "arn:aws:s3:::${RosterBucket}/state/*"
                - !Ref AWS::NoValue
              # Listing is a bucket-level action, so it is granted separately and pinned
              # to the state prefix — the worker can enumerate its own bookkeeping and
              # nothing else in the bucket. state/*, not state/approvals/*: without list
              # permission S3 masks a missing object as AccessDenied instead of NoSuchKey,
              # so the ledgers at state/ (gate blocks, chat posts) logged a permissions
              # warning on every run until their first write. Observed live 2026-08-19.
              - !If
                - HasRoster
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub "arn:aws:s3:::${RosterBucket}"
                  Condition:
                    StringLike:
                      s3:prefix: "state/*"
                - !Ref AWS::NoValue
              # Scoped to the one key, like the roster above — not the bucket. Both objects
              # are authorization data; read-only, and nothing else in that bucket is ours.
              - !If
                - HasCarrierContacts
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:aws:s3:::${RosterBucket}/${CarrierContactsKey}"
                - !Ref AWS::NoValue
              # The CargoTel session cookie. Scoped to the one key, not the bucket: the
              # worker never needs another bot's cookies and never needs to write. The
              # bucket belongs to the login bot, which is why this is the only
              # cross-system grant in the plan.
              - !If
                - CargoTelOn
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:aws:s3:::${CargoTelCookieBucket}/${CargoTelCookieKey}"
                - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # The worker.
  # -------------------------------------------------------------------------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/paybot-worker-${StackEnv}"
      RetentionInDays: !Ref LogRetentionDays

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub "paybot-worker-${StackEnv}"
      Description: Fetch carrier mail, draft replies, gate them, save to Gmail Drafts.
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: payment_bot.lambda_handler.handler
      Role: !GetAtt WorkerRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      # 15 minutes is the ceiling, not a target. §3.7: a five-load factoring enquiry can
      # take four times a single-load one, so this plus FetchLimit=5 is the bound. If real
      # runs approach it, the answer is Fargate (same container, no cap), not a bigger number.
      Timeout: 900
      MemorySize: 1024
      # Concurrency 1 — not for safety (thread-skip makes concurrent runs converge) but to
      # keep Gmail API usage and the logs legible.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          TZ: !Ref Timezone
          PAYBOT_ENV: !Ref StackEnv
          PAYBOT_LOG_LEVEL: INFO
          # Draft-only is belt and braces: process_inbox forces it regardless.
          PAYBOT_DRAFT_ONLY: "true"
          PAYBOT_ROLLOUT_PHASE: "1"

          PAYBOT_SECRET_GOOGLE_SA: !Ref GoogleServiceAccountSecret
          PAYBOT_SECRET_TP_PASSWORD: !Ref TransportProPasswordSecret
          PAYBOT_ROSTER_BUCKET: !Ref RosterBucket
          PAYBOT_ROSTER_KEY: !Ref RosterKey
          PAYBOT_CARRIER_CONTACTS_KEY: !Ref CarrierContactsKey

          PAYBOT_AWS_REGION: !Ref AWS::Region
          # Must stay blank. The execution role is the credential source here; naming a
          # profile that does not exist would break the cookie read outright.
          PAYBOT_AWS_PROFILE: ""
          PAYBOT_MODEL_DRAFT: !Ref BedrockModelId

          PAYBOT_GMAIL_USER: !Ref GmailUser
          PAYBOT_GMAIL_QUERY: !Ref GmailQuery
          PAYBOT_GMAIL_FETCH_LIMIT: !Ref FetchLimit
          PAYBOT_GMAIL_CREATE_DRAFT: "true"
          PAYBOT_GMAIL_MARK_SEEN: "false"

          PAYBOT_TP_BASE_URL: !Ref TransportProBaseUrl
          PAYBOT_TP_USERNAME: !Ref TransportProUsername

          PAYBOT_CARGOTEL_REPLIES: !Ref CargoTelReplies
          PAYBOT_CARGOTEL_COOKIE_BUCKET: !Ref CargoTelCookieBucket
          PAYBOT_CARGOTEL_COOKIE_KEY: !Ref CargoTelCookieKey

          PAYBOT_ALLOW_FACTORING: !Ref AllowFactoring
          PAYBOT_SENSITIVE_BANK_REPLIES: !Ref SensitiveBankReplies
          PAYBOT_SENSITIVE_NOA_REPLIES: !Ref SensitiveNoaReplies
          PAYBOT_NOA_ATTACHMENT_REPLIES: !Ref NoaAttachmentReplies
          PAYBOT_FACTORING_PRENOA_REPLIES: !Ref FactoringPrenoaReplies
          PAYBOT_LLM_ID_FILTER: !Ref LlmIdFilter
          PAYBOT_GATE_BLOCK_RETRY_LIMIT: !Ref GateBlockRetryLimit
          PAYBOT_AUTO_ADD_FACTORING_DOMAINS: !Ref AutoAddFactoringDomains

          PAYBOT_REPLY_SIGNATURE: !Ref ReplySignature
          PAYBOT_REPLY_CC: !Ref ReplyCc
          PAYBOT_REPLY_TO: !Ref ReplyTo
          PAYBOT_DOCUMENTS_EMAIL: !Ref DocumentsEmail
          PAYBOT_PORTAL_URL: !Ref PortalUrl

          PAYBOT_APPROVAL_MODE: !Ref ApprovalMode
          PAYBOT_REVIEWERS: !Ref Reviewers
          PAYBOT_CHAT_SPACE: !Ref ChatSpace
          PAYBOT_APPROVAL_EXPIRY_DAYS: !Ref ApprovalExpiryDays

  Schedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "paybot-worker-${StackEnv}"
      Description: Every 20 minutes, offset from the workstation task's :39.
      ScheduleExpression: !Ref ScheduleExpression
      State: !If [ScheduleOn, ENABLED, DISABLED]
      Targets:
        - Id: worker
          Arn: !GetAtt WorkerFunction.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt WorkerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn

  # -------------------------------------------------------------------------
  # Chat-approval callback (docs/CHAT_APPROVAL_PLAN.md §3) — created only when a
  # ChatSpace is configured. Its own role on purpose: sending capability lives in
  # exactly one deployable, which is what the Stage-2 split was for. No Bedrock, no
  # rosters, no Transport Pro — the Google SA secret and the approvals state, that's it.
  # -------------------------------------------------------------------------
  CallbackRole:
    Type: AWS::IAM::Role
    Condition: HasChatSpace
    Properties:
      RoleName: !Sub "paybot-chat-callback-${StackEnv}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: paybot-chat-callback
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GoogleServiceAccountSecret
              # Narrower than the worker: the approvals prefix only, never the ledgers
              # or the rosters. Delete is the claim-release path on a failed send.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${RosterBucket}/state/approvals/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${RosterBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "state/approvals/*"

  CallbackLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasChatSpace
    Properties:
      LogGroupName: !Sub "/aws/lambda/paybot-chat-callback-${StackEnv}"
      RetentionInDays: !Ref LogRetentionDays

  CallbackFunction:
    Type: AWS::Lambda::Function
    Condition: HasChatSpace
    DependsOn: CallbackLogGroup
    Properties:
      FunctionName: !Sub "paybot-chat-callback-${StackEnv}"
      Description: >
        Google Chat button clicks: verify the token, claim the entry, send AS THE
        CLICKER. The one function in this system that sends email.
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: payment_bot.chat_callback.handler
      Role: !GetAtt CallbackRole.Arn
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      # Chat allows 30 s for a synchronous reply; cold start + one Gmail send fits with
      # room. 512 MB because the callback imports no model stack.
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TZ: !Ref Timezone
          PAYBOT_ENV: !Ref StackEnv
          PAYBOT_LOG_LEVEL: INFO
          PAYBOT_SECRET_GOOGLE_SA: !Ref GoogleServiceAccountSecret
          PAYBOT_ROSTER_BUCKET: !Ref RosterBucket
          PAYBOT_REVIEWERS: !Ref Reviewers
          PAYBOT_CHAT_AUDIENCE: !Ref ChatAudience
          PAYBOT_REPLY_TO: !Ref ReplyTo

  # Function URL, not API Gateway: free, and the CHAT_APPROVAL_PLAN.md §8 cost case
  # depends on it. AuthType NONE is required — Google Chat cannot sign SigV4 — so the
  # bearer-token verification inside the handler IS the perimeter, and with no
  # ChatAudience configured the handler rejects everything (fail closed).
  CallbackUrl:
    Type: AWS::Lambda::Url
    Condition: HasChatSpace
    Properties:
      TargetFunctionArn: !GetAtt CallbackFunction.Arn
      AuthType: NONE

  CallbackUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasChatSpace
    Properties:
      FunctionName: !GetAtt CallbackFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # -------------------------------------------------------------------------
  # Observability (§3.5). The JSON log lines are already machine-parseable, so
  # every metric below is a filter over them rather than new instrumentation.
  # -------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "paybot-alarms-${StackEnv}"
      DisplayName: Payment bot alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DraftsCreatedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "gmail_api_draft_created" }'
      MetricTransformations:
        - MetricName: DraftsCreated
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  GateBlockedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "gate_blocked" }'
      MetricTransformations:
        - MetricName: GateBlocked
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  # A message that spent its GateBlockRetryLimit and is now skipped every run. Like
  # PolicyAllowedChangeWording below, each of these is a TASK: the mail sits unread with
  # no draft and nothing will retry it — a human must reply or raise the limit.
  GateBlockRetriesExhaustedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "gate_block_retries_exhausted" }'
      MetricTransformations:
        - MetricName: GateBlockRetriesExhausted
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  EscalationsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "escalated" }'
      MetricTransformations:
        - MetricName: Escalations
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  # The alarm that matters most on the CargoTel path: nothing else looks broken while it
  # fires, and every 6-digit email is waiting on it. Kept separate from CargoTelNotALoad
  # on purpose — one is systemic and urgent, the other is a carrier writing an invoice
  # number in an email, and collapsing them buries the urgent case in routine noise.
  CargoTelCookieStaleMetric:
    Type: AWS::Logs::MetricFilter
    Condition: CargoTelOn
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '"session cookie is probably expired"'
      MetricTransformations:
        - MetricName: CargoTelCookieStale
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  # Distinct from the above: the cookie could not be READ (IAM, bucket policy, missing
  # object) rather than read and rejected. Should be near-impossible here — the execution
  # role does not expire — so a hit means a permissions problem, not a stale login.
  CargoTelCookieUnavailableMetric:
    Type: AWS::Logs::MetricFilter
    Condition: CargoTelOn
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "cargotel_cookie_unavailable" }'
      MetricTransformations:
        - MetricName: CargoTelCookieUnavailable
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  # Fires when an email carrying a bank or NOA instruction was drafted anyway because the
  # policy switches allow it. The gate guarantees the draft never acknowledges it; nothing
  # guarantees anyone actions it. Treat each entry as a task, not a log line.
  PolicyAllowedChangeWordingMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.message = "bank_change_language_allowed_by_policy" }'
      MetricTransformations:
        - MetricName: PolicyAllowedChangeWording
          MetricNamespace: !Sub "PaymentBot/${StackEnv}"
          MetricValue: "1"
          DefaultValue: 0

  RunFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "paybot-${StackEnv}-RunFailures"
      AlarmDescription: Any worker invocation error. Fail-closed means this is never routine.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref WorkerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  GateBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "paybot-${StackEnv}-GateBlocked"
      AlarmDescription: >
        More than two blocked drafts in a day means the model is misbehaving. The gate
        doing its job is not the problem; the rate is.
      Namespace: !Sub "PaymentBot/${StackEnv}"
      MetricName: GateBlocked
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  CargoTelCookieStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CargoTelOn
    Properties:
      AlarmName: !Sub "paybot-${StackEnv}-CargoTelCookieStale"
      AlarmDescription: >
        Any occurrence pages. Not mitigable from inside this system — the login bot owns
        the cookie (§3.1 P8). Until it is refreshed, every 6-digit email escalates.
      Namespace: !Sub "PaymentBot/${StackEnv}"
      MetricName: CargoTelCookieStale
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  CargoTelCookieUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CargoTelOn
    Properties:
      AlarmName: !Sub "paybot-${StackEnv}-CargoTelCookieUnavailable"
      AlarmDescription: >
        The cookie could not be read at all. In Lambda this means IAM or bucket policy,
        not a stale login — check the cross-account grant on the login bot's bucket.
      Namespace: !Sub "PaymentBot/${StackEnv}"
      MetricName: CargoTelCookieUnavailable
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ChatCallbackUrl:
    Condition: HasChatSpace
    Description: >
      Paste into the Chat app's "HTTP endpoint URL" in the GCP console
      (Chat API → Configuration). Until that manual step, nothing calls it.
    Value: !GetAtt CallbackUrl.FunctionUrl
  FunctionName:
    Value: !Ref WorkerFunction
  LogGroup:
    Value: !Ref WorkerLogGroup
  ScheduleName:
    Value: !Ref Schedule
  ScheduleState:
    Value: !If [ScheduleOn, ENABLED, DISABLED]
  GoogleSecretArn:
    Value: !Ref GoogleServiceAccountSecret
  TransportProSecretArn:
    Value: !Ref TransportProPasswordSecret
  AlarmTopicArn:
    Value: !Ref AlarmTopic
