[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-bot"
version = "0.1.0"
description = "Payments Email Bot — agentic tool-use bot for payment status & rate verification (Circle Delivers)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Circle Delivers — Payments" }]

# Runtime dependencies kept deliberately small. boto3 is an *extra* (`aws`) so the
# deterministic core, tools, gate, and the scripted agent loop can be installed and
# unit-tested without pulling the AWS SDK. See BedrockLlmClient for the lazy import.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
# Gmail API backend: `google-auth` is used for RSA-signing the service-account JWT only.
# All HTTP goes through our own transport, so no google-api-python-client / requests.
google = ["google-auth>=2.28"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
payment-bot-demo = "payment_bot.runner:main"
# Local draft-only run: real inbox + real Transport Pro + Groq → Slack review. Never sends.
payment-bot-local = "payment_bot.local_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_bot"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated, no I/O",
    "integration: exercises the wired pipeline end-to-end with mock clients",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic-but-strict set: pyflakes, pycodestyle, isort, bugbear, comprehensions,
# pyupgrade, simplify, naming. Explicit over implicit.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "N", "RUF"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["payment_bot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["payment_bot"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "google.*", "google.auth.*"]
ignore_missing_imports = true
